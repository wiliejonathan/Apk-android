name: Publish Android REV390 Activation Backend Fallback
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV390-apk/READY'
permissions:
  contents: write
concurrency:
  group: publish-android-rev390
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch tested REV390 mobile source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          rm -rf "$ROOT"
          mkdir -p "$ROOT/mobile" "$ROOT/base" "$ROOT/signing-ready/assets/www"
          gh release download v1.17.03             --repo wiliejonathan/tf-analyzer-analyst-ios             --pattern 'TF_Analyzer_Analyst_iOS_BROWSER_REV390_ACTIVATION_BACKEND_FALLBACK.zip'             --output "$ROOT/mobile.zip"
          unzip -tq "$ROOT/mobile.zip"
          unzip -q "$ROOT/mobile.zip" -d "$ROOT/mobile"
          test -f "$ROOT/mobile/mobile-license-gate.js"
          grep -F 'LICENSE_ENDPOINT_POINTER_URL' "$ROOT/mobile/mobile-license-gate.js"
          grep -F 'DIRECT_APPS_SCRIPT_PUBLIC_LOOKUP' "$ROOT/mobile/mobile-license-gate.js"
          grep -F "MOBILE_TOKEN_LOGIN_OK_FALLBACK" "$ROOT/mobile/mobile-license-gate.js"
          grep -F "'APPS_SCRIPT_HTTP_ERROR'" "$ROOT/mobile/mobile-license-gate.js"
          grep -F "mobileVersion: '1.17.03'" "$ROOT/mobile/mobile-license-gate.js"
          grep -F "remoteRevision: 'REV390'" "$ROOT/mobile/mobile-license-gate.js"
          grep -F "var CURRENT_TAG = 'v1.17.03';" "$ROOT/mobile/mobile-force-update.js"
          grep -F '?rev=390' "$ROOT/mobile/index.html"
          node --check "$ROOT/mobile/mobile-license-gate.js"
          node --check "$ROOT/mobile/mobile-force-update.js"

      - name: Probe direct fallback endpoint
        run: |
          set -euo pipefail
          POINTER='https://raw.githubusercontent.com/wiliejonathan/tf-analyzer-admin/main/license-endpoint.json'
          curl -fsSL --connect-timeout 10 --max-time 20 "$POINTER" -o /tmp/pointer.json
          APPS_URL=$(python3 -c "import json,re; p=json.load(open('/tmp/pointer.json')); u=str(p.get('apiUrl') or ''); assert re.match(r'^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$',u); print(u)")
          CODE=$(curl -sSL -o /tmp/license.body -w '%{http_code}'             --connect-timeout 10 --max-time 30             -H 'Content-Type: text/plain;charset=UTF-8'             --data '{"action":"lookup","email":"diagnostic@example.invalid","token":"INVALID-DIAGNOSTIC","deviceType":"MOBILE","clientType":"MOBILE","source":"REV390_ANDROID_QA"}'             "$APPS_URL")
          test "$CODE" = "200"
          python3 -c "import json; r=json.load(open('/tmp/license.body')); assert r.get('valid') is False and r.get('code') == 'LICENSE_NOT_FOUND'; print('Fallback endpoint QA PASS')"

      - name: Build production-signing-ready package
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          cp -a "$ROOT/mobile/." "$ROOT/signing-ready/assets/www/"
          printf '%s\n'             'TF Analyzer Analyst Android REV390 / v1.17.03 - Production Signing Ready'             'Activation fallback handles Worker Apps Script HTTP 404/timeout/network failures.'             > "$ROOT/signing-ready/README_ANDROID_REV390_SIGNING_READY.txt"
          (cd "$ROOT/signing-ready" && zip -qr "$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip" .)
          sha256sum "$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip"             > "$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip.sha256"

      - name: Build fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          gh release download v1.16.69             --repo "$GITHUB_REPOSITORY"             --pattern 'TF.Analyzer.Analyst.V1.16.69_REV372.apk'             --dir "$ROOT/base"

          cat > /tmp/build_rev390_apk.py <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/tf-rev390-android')
          src=root/'base'/'TF.Analyzer.Analyst.V1.16.69_REV372.apk'
          out=root/'TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk'
          web=root/'mobile'
          with zipfile.ZipFile(src,'r') as zin:
              infos={i.filename:i for i in zin.infolist()}
              files={i.filename:zin.read(i.filename) for i in zin.infolist()}
          keep={}
          for name,blob in files.items():
              up=name.upper()
              if name.startswith('assets/www/'):
                  continue
              if up.startswith('META-INF/') and (up.endswith('.RSA') or up.endswith('.SF') or up.endswith('MANIFEST.MF')):
                  continue
              keep[name]=blob

          data=bytearray(keep['AndroidManifest.xml'])
          old='1.16.69'.encode('utf-16le')
          new='1.17.03'.encode('utf-16le')
          assert data.count(old)==1
          data=data.replace(old,new,1)
          code110=bytes([0x08,0x00,0x00,0x10])+(110).to_bytes(4,'little')
          pos=data.find(code110)
          assert pos>=0 and data.find(code110,pos+1)<0
          data[pos+4:pos+8]=(120).to_bytes(4,'little')
          keep['AndroidManifest.xml']=bytes(data)

          updates={}
          for p in web.rglob('*'):
              if p.is_file():
                  updates['assets/www/'+p.relative_to(web).as_posix()]=p.read_bytes()
          updates['assets/www/README_ANDROID_REV390.txt']=(
              'TF Analyzer Analyst Android REV390\n'
              'Version: v1.17.03\n'
              'Version Code: 120\n'
              'Activation backend fallback for Apps Script HTTP 404.\n'
          ).encode()

          with zipfile.ZipFile(out,'w') as zout:
              for name,blob in keep.items():
                  info=infos[name]
                  ni=zipfile.ZipInfo(name,info.date_time)
                  ni.compress_type=info.compress_type
                  ni.external_attr=info.external_attr
                  ni.internal_attr=info.internal_attr
                  ni.create_system=info.create_system
                  ni.extra=info.extra
                  ni.comment=info.comment
                  ni.flag_bits=info.flag_bits
                  zout.writestr(ni,blob)
              for name,blob in sorted(updates.items()):
                  ni=zipfile.ZipInfo(name,(2026,9,30,17,50,0))
                  ni.compress_type=zipfile.ZIP_DEFLATED
                  ni.create_system=3
                  ni.external_attr=0o100644 << 16
                  zout.writestr(ni,blob)
          print(out)
          PY
          python3 /tmp/build_rev390_apk.py

          APK="$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk"
          PW=$(openssl rand -hex 16)
          keytool -genkeypair             -keystore "$ROOT/rev390-fresh.jks"             -storepass "$PW" -keypass "$PW"             -alias tfanalyzer-rev390-fresh             -keyalg RSA -keysize 3072 -validity 3650             -dname 'CN=TF Analyzer Analyst REV390 Fresh Install, OU=Mobile, O=Skill Fusion, C=ID'
          jarsigner             -keystore "$ROOT/rev390-fresh.jks"             -storepass "$PW" -keypass "$PW"             -sigalg SHA256withRSA -digestalg SHA-256             "$APK" tfanalyzer-rev390-fresh
          jarsigner -verify "$APK" >/dev/null
          unzip -tq "$APK"
          unzip -p "$APK" assets/www/mobile-license-gate.js | grep -F 'DIRECT_APPS_SCRIPT_PUBLIC_LOOKUP'
          unzip -p "$APK" assets/www/mobile-license-gate.js | grep -F "'APPS_SCRIPT_HTTP_ERROR'"
          unzip -p "$APK" assets/www/mobile-license-gate.js | grep -F "remoteRevision: 'REV390'"
          unzip -p "$APK" assets/www/mobile-force-update.js | grep -F "var CURRENT_TAG = 'v1.17.03';"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publish signing-ready assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          TAG=v1.17.03-assets
          ZIP="$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip"
          SHA="$ZIP.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --target "$GITHUB_SHA"               --title 'TF Analyzer Analyst Android REV390 - Production Signing Ready'               --notes-file release-staging/REV390-signing-ready/RELEASE_NOTES.md               --prerelease
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA"               --target "$GITHUB_SHA"               --title 'TF Analyzer Analyst Android REV390 - Production Signing Ready'               --notes-file release-staging/REV390-signing-ready/RELEASE_NOTES.md               --prerelease
          fi

      - name: Publish fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          TAG=v1.17.03-android
          APK="$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk"
          SHA="$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG"               --target "$GITHUB_SHA"               --title 'TF Analyzer Analyst Android V1.17.03 - REV390 Activation Backend Fallback'               --notes-file release-staging/REV390-apk/RELEASE_NOTES.md               --prerelease
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA"               --target "$GITHUB_SHA"               --title 'TF Analyzer Analyst Android V1.17.03 - REV390 Activation Backend Fallback'               --notes-file release-staging/REV390-apk/RELEASE_NOTES.md               --prerelease
          fi
