name: Publish Android REV390 Activation backend fallback
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV390-apk/READY'
permissions:
  contents: write
concurrency:
  group: publish-android-rev390
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch REV389 Android signing-ready source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          rm -rf "$ROOT" && mkdir -p "$ROOT/src" "$ROOT/base" "$ROOT/signing-ready"
          gh release download v1.17.02-assets --repo "$GITHUB_REPOSITORY" --pattern 'TF_Analyzer_Android_REV389_V1.17.02_PRODUCTION_SIGNING_READY.zip' --output "$ROOT/base-source.zip"
          unzip -tq "$ROOT/base-source.zip"
          unzip -q "$ROOT/base-source.zip" -d "$ROOT/src"
          test -f "$ROOT/src/assets/www/mobile-license-gate.js"
      - name: Patch activation backend fallback and bump REV390
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/tf-rev390-android/src/assets/www')
          gate=root/'mobile-license-gate.js'
          s=gate.read_text()

          api_base="const API_BASE = 'https://tf-license-device-api.wiliejonathan1999.workers.dev';"
          if 'LICENSE_ENDPOINT_POINTER_URL' not in s:
              assert api_base in s
              s=s.replace(api_base, api_base+"\n  const LICENSE_ENDPOINT_POINTER_URL = 'https://raw.githubusercontent.com/wiliejonathan/tf-analyzer-admin/main/license-endpoint.json';\n  const LICENSE_DIRECT_FALLBACK_URL = 'https://script.google.com/macros/s/AKfycbzUbx40vGvuCS4hQEOdfs-DeSU_TY-9zWXXPZzOKn3D9h0m5pQQYD6GGNCefufvsrv2eA/exec';",1)

          start=s.index('  async function api(path, body, timeoutMs = 15000) {')
          end=s.index('\n  function isTfStorageKey',start)
          replacement=r'''  function isLicenseFallbackPath(path) {
            return path === '/mobile/login' || path === '/license-check';
          }

          function shouldUseDirectLicenseFallback(result, httpStatus) {
            const code = String(result && (result.code || result.error) || '').trim().toUpperCase();
            if ([
              'APPS_SCRIPT_HTTP_ERROR',
              'APPS_SCRIPT_TIMEOUT',
              'APPS_SCRIPT_NETWORK_ERROR',
              'APPS_SCRIPT_INVALID_RESPONSE',
              'APPS_SCRIPT_ERROR'
            ].includes(code)) return true;
            return Number(httpStatus || 0) >= 500;
          }

          async function resolveDirectLicenseUrl() {
            let resolved = LICENSE_DIRECT_FALLBACK_URL;
            const controller = typeof AbortController === 'function' ? new AbortController() : null;
            const timer = setTimeout(() => {
              try { controller && controller.abort(); } catch (_) {}
            }, 5000);
            try {
              const response = await fetch(LICENSE_ENDPOINT_POINTER_URL + '?t=' + Date.now(), {
                method: 'GET',
                cache: 'no-store',
                redirect: 'follow',
                signal: controller ? controller.signal : undefined,
                headers: { 'Accept': 'application/json' }
              });
              if (response.ok) {
                const pointer = await response.json();
                const candidate = String(pointer && pointer.apiUrl || '').trim();
                if (/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/i.test(candidate)) {
                  resolved = candidate;
                }
              }
            } catch (_) {
            } finally {
              clearTimeout(timer);
            }
            return resolved;
          }

          async function directLicenseLookup(body, timeoutMs = 25000) {
            const url = await resolveDirectLicenseUrl();
            const controller = typeof AbortController === 'function' ? new AbortController() : null;
            const timer = setTimeout(() => {
              try { controller && controller.abort(); } catch (_) {}
            }, Math.max(8000, timeoutMs));
            try {
              const response = await fetch(url, {
                method: 'POST',
                cache: 'no-store',
                redirect: 'follow',
                signal: controller ? controller.signal : undefined,
                headers: {
                  'Content-Type': 'text/plain;charset=UTF-8',
                  'Accept': 'application/json,text/plain;q=0.9,*/*;q=0.1'
                },
                body: JSON.stringify({
                  action: 'lookup',
                  email: cleanEmail(body && body.email),
                  token: normalizeToken(body && body.token),
                  licenseId: String(body && (body.licenseId || body.license) || '').trim(),
                  deviceType: 'MOBILE',
                  clientType: 'MOBILE',
                  source: 'REV390_DIRECT_LICENSE_FALLBACK'
                })
              });
              const text = await response.text();
              let result;
              try { result = JSON.parse(text); }
              catch (_) { throw new Error('Respons fallback lisensi bukan JSON.'); }
              if (!response.ok) {
                const err = new Error(String(result && result.message || ('Fallback Apps Script HTTP ' + response.status)));
                err.code = String(result && result.code || 'DIRECT_APPS_SCRIPT_HTTP_ERROR');
                throw err;
              }
              if (result && result.valid === true) {
                return {
                  ...result,
                  ok: true,
                  valid: true,
                  sessionValid: true,
                  portableSession: true,
                  tokenGate: true,
                  noDeviceLimit: true,
                  mobileApprovalRequired: false,
                  fallbackTransport: 'DIRECT_APPS_SCRIPT_PUBLIC_LOOKUP',
                  code: 'MOBILE_TOKEN_LOGIN_OK_FALLBACK',
                  message: 'Token valid. Aktivasi menggunakan server lisensi cadangan.'
                };
              }
              return result || { ok:true, valid:false, code:'LICENSE_NOT_FOUND', message:'Email atau token tidak ditemukan.' };
            } finally {
              clearTimeout(timer);
            }
          }

          async function api(path, body, timeoutMs = 15000) {
            const controller = typeof AbortController === 'function' ? new AbortController() : null;
            const timeout = setTimeout(() => {
              try { controller && controller.abort(); } catch (_) {}
            }, Math.max(3500, timeoutMs));

            try {
              const response = await fetch(API_BASE + path, {
                method: 'POST',
                cache: 'no-store',
                redirect: 'follow',
                signal: controller ? controller.signal : undefined,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  ...(body || {}),
                  deviceType: 'MOBILE',
                  clientType: 'MOBILE',
                  mobilePlatform: platformName(),
                  mobileVersion: '1.17.03',
                  remoteRevision: 'REV390',
                  requestNonce: String(Date.now()) + '-' + Math.random().toString(36).slice(2)
                })
              });

              const text = await response.text();
              let result;
              try { result = JSON.parse(text); }
              catch (_) {
                if (isLicenseFallbackPath(path)) {
                  return await directLicenseLookup(body, Math.max(timeoutMs, 25000));
                }
                throw new Error('Respons server bukan JSON.');
              }
              if (isLicenseFallbackPath(path) && shouldUseDirectLicenseFallback(result, response.status)) {
                return await directLicenseLookup(body, Math.max(timeoutMs, 25000));
              }
              if (!response.ok && !result.message) result.message = 'HTTP ' + response.status;
              return result;
            } catch (error) {
              if (isLicenseFallbackPath(path) && error && (error.name === 'AbortError' || error.name === 'TypeError')) {
                return await directLicenseLookup(body, Math.max(timeoutMs, 25000));
              }
              throw error;
            } finally {
              clearTimeout(timeout);
            }
          }
'''
          s=s[:start]+replacement+s[end:]
          s=s.replace("mobileVersion: '1.17.02'","mobileVersion: '1.17.03'")
          s=s.replace("remoteRevision: 'REV389'","remoteRevision: 'REV390'")
          s=s.replace('rev=389','rev=390').replace('rev389','rev390').replace('REV389','REV390')
          gate.write_text(s)

          for name in ['index.html','service-worker.js']:
              p=root/name
              x=p.read_text().replace('rev=389','rev=390').replace('rev389','rev390').replace('REV389','REV390')
              if name=='service-worker.js':
                  lines=x.splitlines()
                  if lines and lines[0].startswith('const CACHE='):
                      lines[0]="const CACHE='tf-analyzer-analyst-android-rev390-activation-backend-fallback';"
                      x='\n'.join(lines)+'\n'
              p.write_text(x)

          upd=root/'mobile-force-update.js'
          u=upd.read_text()
          assert "var CURRENT_TAG = 'v1.17.02';" in u
          upd.write_text(u.replace("var CURRENT_TAG = 'v1.17.02';","var CURRENT_TAG = 'v1.17.03';",1))

          (root/'README_ANDROID_REV390_SOURCE.txt').write_text(
              'TF Analyzer Analyst Android REV390 / v1.17.03\n'
              'Activation: Worker remains primary; Apps Script public lookup is fallback for Worker backend 404/timeout/network errors.\n'
              'REV389 retry reliability and REV388 Performance Holding retained.\n'
          )
          PY
          node --check /tmp/tf-rev390-android/src/assets/www/mobile-license-gate.js
          node --check /tmp/tf-rev390-android/src/assets/www/mobile-app-shell.js
          node --check /tmp/tf-rev390-android/src/assets/www/assets/dashboard-mobile.js
          node --check /tmp/tf-rev390-android/src/assets/www/mobile-force-update.js
      - name: Validate fallback behavior and endpoint
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/tf-rev390-android/src/assets/www')
          gate=(root/'mobile-license-gate.js').read_text()
          shell=(root/'mobile-app-shell.js').read_text()
          dash=(root/'assets/dashboard-mobile.js').read_text()
          upd=(root/'mobile-force-update.js').read_text()
          idx=(root/'index.html').read_text()
          assert 'LICENSE_ENDPOINT_POINTER_URL' in gate
          assert 'DIRECT_APPS_SCRIPT_PUBLIC_LOOKUP' in gate
          assert 'MOBILE_TOKEN_LOGIN_OK_FALLBACK' in gate
          assert "'APPS_SCRIPT_HTTP_ERROR'" in gate
          assert "mobileVersion: '1.17.03'" in gate
          assert "remoteRevision: 'REV390'" in gate
          assert "api('/mobile/login', { email, token }, 30000)" in gate
          assert "api('/mobile/login', { email, token }, 45000)" in gate
          assert "const holding = q('tf-holding-period-section');" in shell
          assert 'REV387: Max and Avg both use the exact active Table 3 filtered trade rows.' in dash
          assert '?rev=390' in idx
          assert "var CURRENT_TAG = 'v1.17.03';" in upd
          print('REV390 Android source QA PASS')
          PY
          POINTER='https://raw.githubusercontent.com/wiliejonathan/tf-analyzer-admin/main/license-endpoint.json'
          curl -fsSL --connect-timeout 10 --max-time 20 "$POINTER" -o /tmp/pointer.json
          APPS_URL=$(python3 - <<'PY'
          import json,re
          p=json.load(open('/tmp/pointer.json'))
          u=str(p.get('apiUrl') or '')
          assert re.match(r'^https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec$',u)
          print(u)
          PY
          )
          CODE=$(curl -sSL -o /tmp/license.body -w '%{http_code}' --connect-timeout 10 --max-time 30             -H 'Content-Type: text/plain;charset=UTF-8'             --data '{"action":"lookup","email":"diagnostic@example.invalid","token":"INVALID-DIAGNOSTIC","deviceType":"MOBILE","clientType":"MOBILE","source":"REV390_ANDROID_QA"}'             "$APPS_URL")
          test "$CODE" = "200"
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/license.body'))
          assert r.get('valid') is False and r.get('code') == 'LICENSE_NOT_FOUND'
          print('REV390 direct fallback endpoint QA PASS')
          PY
      - name: Build production-signing-ready package
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          cp -a "$ROOT/src/." "$ROOT/signing-ready/"
          printf '%s\n' 'TF Analyzer Analyst Android REV390 / v1.17.03 - Production Signing Ready' 'Activation backend 404 fallback; REV389 retry and REV388 Performance Holding retained.' > "$ROOT/signing-ready/README_ANDROID_REV390_SIGNING_READY.txt"
          (cd "$ROOT/signing-ready" && zip -qr "$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip" .)
          sha256sum "$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip" > "$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip.sha256"
      - name: Build fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          gh release download v1.16.69 --repo "$GITHUB_REPOSITORY" --pattern 'TF.Analyzer.Analyst.V1.16.69_REV372.apk' --dir "$ROOT/base"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/tf-rev390-android')
          src=root/'base'/'TF.Analyzer.Analyst.V1.16.69_REV372.apk'
          out=root/'TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk'
          web=root/'src'/'assets'/'www'
          with zipfile.ZipFile(src,'r') as zin:
              infos={i.filename:i for i in zin.infolist()}
              files={i.filename:zin.read(i.filename) for i in zin.infolist()}
          keep={}
          for name,blob in files.items():
              up=name.upper()
              if name.startswith('assets/www/'): continue
              if up.startswith('META-INF/') and (up.endswith('.RSA') or up.endswith('.SF') or up.endswith('MANIFEST.MF')): continue
              keep[name]=blob
          data=bytearray(keep['AndroidManifest.xml'])
          old='1.16.69'.encode('utf-16le'); new='1.17.03'.encode('utf-16le')
          assert data.count(old)==1
          data=data.replace(old,new,1)
          code110=bytes([0x08,0x00,0x00,0x10])+(110).to_bytes(4,'little')
          pos=data.find(code110)
          assert pos>=0 and data.find(code110,pos+1)<0
          data[pos+4:pos+8]=(120).to_bytes(4,'little')
          keep['AndroidManifest.xml']=bytes(data)
          updates={}
          for p in web.rglob('*'):
              if p.is_file(): updates['assets/www/'+p.relative_to(web).as_posix()]=p.read_bytes()
          updates['assets/www/README_ANDROID_REV390.txt']=b'TF Analyzer Analyst Android REV390\nVersion: v1.17.03\nVersion Code: 120\nActivation backend fallback fix.\n'
          with zipfile.ZipFile(out,'w') as zout:
              for name,blob in keep.items():
                  info=infos[name]
                  ni=zipfile.ZipInfo(name,info.date_time)
                  ni.compress_type=info.compress_type; ni.external_attr=info.external_attr; ni.internal_attr=info.internal_attr
                  ni.create_system=info.create_system; ni.extra=info.extra; ni.comment=info.comment; ni.flag_bits=info.flag_bits
                  zout.writestr(ni,blob)
              for name,blob in sorted(updates.items()):
                  ni=zipfile.ZipInfo(name,(2026,9,30,17,45,0)); ni.compress_type=zipfile.ZIP_DEFLATED; ni.create_system=3; ni.external_attr=0o100644 << 16
                  zout.writestr(ni,blob)
          print(out)
          PY
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$ROOT/rev390-fresh.jks" -storepass "$PW" -keypass "$PW" -alias tfanalyzer-rev390-fresh -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=TF Analyzer Analyst REV390 Fresh Install, OU=Mobile, O=Skill Fusion, C=ID'
          jarsigner -keystore "$ROOT/rev390-fresh.jks" -storepass "$PW" -keypass "$PW" -sigalg SHA256withRSA -digestalg SHA-256 "$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk" tfanalyzer-rev390-fresh
          jarsigner -verify "$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk" >/dev/null
          unzip -tq "$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk"
          python3 - <<'PY'
          import zipfile
          apk='/tmp/tf-rev390-android/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk'
          with zipfile.ZipFile(apk) as z:
              gate=z.read('assets/www/mobile-license-gate.js').decode()
              upd=z.read('assets/www/mobile-force-update.js').decode()
              shell=z.read('assets/www/mobile-app-shell.js').decode()
          assert 'DIRECT_APPS_SCRIPT_PUBLIC_LOOKUP' in gate
          assert "'APPS_SCRIPT_HTTP_ERROR'" in gate
          assert "remoteRevision: 'REV390'" in gate
          assert "var CURRENT_TAG = 'v1.17.03';" in upd
          assert "const holding = q('tf-holding-period-section');" in shell
          print('REV390 embedded APK QA PASS')
          PY
          sha256sum "$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk" > "$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk.sha256"
      - name: Publish signing-ready assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          TAG=v1.17.03-assets
          ZIP="$ROOT/TF_Analyzer_Android_REV390_V1.17.03_PRODUCTION_SIGNING_READY.zip"
          SHA="$ZIP.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV390 - Production Signing Ready' --notes-file release-staging/REV390-signing-ready/RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV390 - Production Signing Ready' --notes-file release-staging/REV390-signing-ready/RELEASE_NOTES.md --prerelease
          fi
      - name: Publish fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev390-android
          TAG=v1.17.03-android
          APK="$ROOT/TF.Analyzer.Analyst.V1.17.03_REV390_ACTIVATION_BACKEND_FALLBACK_FRESH_INSTALL.apk"
          SHA="$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.17.03 - REV390 Activation Backend Fallback' --notes-file release-staging/REV390-apk/RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.17.03 - REV390 Activation Backend Fallback' --notes-file release-staging/REV390-apk/RELEASE_NOTES.md --prerelease
          fi
