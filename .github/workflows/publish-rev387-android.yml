name: Publish Android REV387 assets and fresh-install APK
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV387-apk/READY'
permissions:
  contents: write
concurrency:
  group: publish-android-rev387
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch REV387 mobile source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev387-android
          rm -rf "$ROOT" && mkdir -p "$ROOT/mobile" "$ROOT/base" "$ROOT/signing-ready/assets/www"
          gh release download v1.17.00 --repo wiliejonathan/tf-analyzer-analyst-ios --pattern 'TF_Analyzer_Analyst_iOS_BROWSER_REV387_HOLDING_TIMEFRAME_PARITY.zip' --output "$ROOT/mobile.zip"
          unzip -tq "$ROOT/mobile.zip"
          unzip -q "$ROOT/mobile.zip" -d "$ROOT/mobile"
          grep -F 'function tf_renderHoldingPeriodTables(filteredRows)' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'tf_renderHoldingPeriodTables(rowsForUi)' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'tf_parseHistoryTableDateMs(row.createdDate)' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'tf_parseHistoryTableDateMs(row.displayDate)' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'REV387: Max and Avg both use the exact active Table 3 filtered trade rows.' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F "var CURRENT_TAG = 'v1.17.00';" "$ROOT/mobile/mobile-force-update.js"
          grep -F '?rev=387' "$ROOT/mobile/index.html"
      - name: Build signing-ready package
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev387-android
          cp -a "$ROOT/mobile/." "$ROOT/signing-ready/assets/www/"
          cat > "$ROOT/signing-ready/README_ANDROID_REV387_SIGNING_READY.txt" <<'EOF'
          TF Analyzer Analyst Android REV387 / v1.17.00 - Production Signing Ready
          Holding source: Closed At minus Created At; Max and Avg both follow active timeframe/date/analyst/pair filters.
          Sign with original production/update key for update-in-place.
          EOF
          (cd "$ROOT/signing-ready" && zip -qr "$ROOT/TF_Analyzer_Android_REV387_V1.17.00_PRODUCTION_SIGNING_READY.zip" .)
          sha256sum "$ROOT/TF_Analyzer_Android_REV387_V1.17.00_PRODUCTION_SIGNING_READY.zip" > "$ROOT/TF_Analyzer_Android_REV387_V1.17.00_PRODUCTION_SIGNING_READY.zip.sha256"
      - name: Build fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev387-android
          gh release download v1.16.69 --repo "$GITHUB_REPOSITORY" --pattern 'TF.Analyzer.Analyst.V1.16.69_REV372.apk' --dir "$ROOT/base"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/tf-rev387-android'); src=root/'base'/'TF.Analyzer.Analyst.V1.16.69_REV372.apk'; out=root/'TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk'; mobile=root/'mobile'
          with zipfile.ZipFile(src,'r') as zin:
              infos={i.filename:i for i in zin.infolist()}; files={i.filename:zin.read(i.filename) for i in zin.infolist()}
          keep={}
          for name,blob in files.items():
              up=name.upper()
              if name.startswith('assets/www/'): continue
              if up.startswith('META-INF/') and (up.endswith('.RSA') or up.endswith('.SF') or up.endswith('MANIFEST.MF')): continue
              keep[name]=blob
          data=bytearray(keep['AndroidManifest.xml'])
          old='1.16.69'.encode('utf-16le'); new='1.17.00'.encode('utf-16le'); assert data.count(old)==1; data=data.replace(old,new,1)
          code110=bytes([0x08,0x00,0x00,0x10])+(110).to_bytes(4,'little'); pos=data.find(code110); assert pos>=0 and data.find(code110,pos+1)<0; data[pos+4:pos+8]=(117).to_bytes(4,'little')
          keep['AndroidManifest.xml']=bytes(data)
          updates={}
          for p in mobile.rglob('*'):
              if p.is_file(): updates['assets/www/'+p.relative_to(mobile).as_posix()]=p.read_bytes()
          updates['assets/www/README_ANDROID_REV387.txt']=b'TF Analyzer Analyst Android REV387\nVersion: v1.17.00\nVersion Code: 117\nHolding: Closed At - Created At; Max and Avg both follow active timeframe/date/analyst/pair filters.\n'
          with zipfile.ZipFile(out,'w') as zout:
              for name,blob in keep.items():
                  info=infos[name]; ni=zipfile.ZipInfo(name,info.date_time); ni.compress_type=info.compress_type; ni.external_attr=info.external_attr; ni.internal_attr=info.internal_attr; ni.create_system=info.create_system; ni.extra=info.extra; ni.comment=info.comment; ni.flag_bits=info.flag_bits; zout.writestr(ni,blob)
              for name,blob in sorted(updates.items()):
                  ni=zipfile.ZipInfo(name,(2026,9,30,16,0,0)); ni.compress_type=zipfile.ZIP_DEFLATED; ni.create_system=3; ni.external_attr=0o100644 << 16; zout.writestr(ni,blob)
          print(out)
          PY
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$ROOT/rev387-fresh.jks" -storepass "$PW" -keypass "$PW" -alias tfanalyzer-rev387-fresh -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=TF Analyzer Analyst REV387 Fresh Install, OU=Mobile, O=Skill Fusion, C=ID'
          jarsigner -keystore "$ROOT/rev387-fresh.jks" -storepass "$PW" -keypass "$PW" -sigalg SHA256withRSA -digestalg SHA-256 "$ROOT/TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk" tfanalyzer-rev387-fresh
          jarsigner -verify "$ROOT/TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk" >/dev/null
          unzip -tq "$ROOT/TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk"
          python3 - <<'PY'
          import zipfile
          apk='/tmp/tf-rev387-android/TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk'
          with zipfile.ZipFile(apk) as z:
              dash=z.read('assets/www/assets/dashboard-mobile.js').decode(); upd=z.read('assets/www/mobile-force-update.js').decode(); idx=z.read('assets/www/index.html').decode()
          assert 'function tf_renderHoldingPeriodTables(filteredRows)' in dash
          assert 'tf_renderHoldingPeriodTables(rowsForUi)' in dash
          assert 'tf_holdingAllTickerRows' not in dash
          assert 'tf_parseHistoryTableDateMs(row.createdDate)' in dash and 'tf_parseHistoryTableDateMs(row.displayDate)' in dash
          assert 'REV387: Max and Avg both use the exact active Table 3 filtered trade rows.' in dash
          assert "var CURRENT_TAG = 'v1.17.00';" in upd and '?rev=387' in idx
          print('REV387 APK QA PASS')
          PY
          sha256sum "$ROOT/TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk" > "$ROOT/TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk.sha256"
      - name: Publish signing-ready assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev387-android; TAG=v1.17.00-assets; ZIP="$ROOT/TF_Analyzer_Android_REV387_V1.17.00_PRODUCTION_SIGNING_READY.zip"; SHA="$ZIP.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV387 - Production Signing Ready' --notes-file release-staging/REV387-signing-ready/RELEASE_NOTES.md --prerelease; gh release upload "$TAG" "$ZIP" "$SHA" --clobber; else gh release create "$TAG" "$ZIP" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV387 - Production Signing Ready' --notes-file release-staging/REV387-signing-ready/RELEASE_NOTES.md --prerelease; fi
      - name: Publish fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev387-android; TAG=v1.17.00-android; APK="$ROOT/TF.Analyzer.Analyst.V1.17.00_REV387_HOLDING_TIMEFRAME_PARITY_FRESH_INSTALL.apk"; SHA="$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.17.00 - REV387 Fresh Install' --notes-file release-staging/REV387-apk/RELEASE_NOTES.md --prerelease; gh release upload "$TAG" "$APK" "$SHA" --clobber; else gh release create "$TAG" "$APK" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.17.00 - REV387 Fresh Install' --notes-file release-staging/REV387-apk/RELEASE_NOTES.md --prerelease; fi
