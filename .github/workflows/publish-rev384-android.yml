name: Publish Android REV384 assets and fresh-install APK
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV384-apk/READY'
permissions:
  contents: write
concurrency:
  group: publish-android-rev384
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch REV384 mobile source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev384-android
          rm -rf "$ROOT"
          mkdir -p "$ROOT/mobile" "$ROOT/base" "$ROOT/signing-ready/assets/www"
          gh release download v1.16.97 --repo wiliejonathan/tf-analyzer-analyst-ios --pattern 'TF_Analyzer_Analyst_iOS_BROWSER_REV384_HOLDING_ALIGNMENT_FIX.zip' --output "$ROOT/mobile.zip"
          unzip -tq "$ROOT/mobile.zip"
          unzip -q "$ROOT/mobile.zip" -d "$ROOT/mobile"
          grep -F 'tf-holding-period-section' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'Nama Analis - Pair' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'font-variant-numeric:tabular-nums' "$ROOT/mobile/mobile-overrides.css"
          grep -F 'td:nth-child(2)' "$ROOT/mobile/mobile-overrides.css"
          grep -F "var CURRENT_TAG = 'v1.16.97';" "$ROOT/mobile/mobile-force-update.js"
      - name: Build production-signing-ready package
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev384-android
          cp -a "$ROOT/mobile/." "$ROOT/signing-ready/assets/www/"
          cat > "$ROOT/signing-ready/README_ANDROID_REV384_SIGNING_READY.txt" <<'EOF'
          TF Analyzer Analyst Android REV384 / v1.16.97 - Production Signing Ready
          ========================================================================
          Mobile source: iOS/browser REV384 v1.16.97.
          Replace wrapper assets/www with this folder and sign using the original production/update key.
          EOF
          (cd "$ROOT/signing-ready" && zip -qr "$ROOT/TF_Analyzer_Android_REV384_V1.16.97_PRODUCTION_SIGNING_READY.zip" .)
          sha256sum "$ROOT/TF_Analyzer_Android_REV384_V1.16.97_PRODUCTION_SIGNING_READY.zip" > "$ROOT/TF_Analyzer_Android_REV384_V1.16.97_PRODUCTION_SIGNING_READY.zip.sha256"
      - name: Build REV384 fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev384-android
          gh release download v1.16.69 --repo "$GITHUB_REPOSITORY" --pattern 'TF.Analyzer.Analyst.V1.16.69_REV372.apk' --dir "$ROOT/base"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/tf-rev384-android')
          src=root/'base'/'TF.Analyzer.Analyst.V1.16.69_REV372.apk'
          out=root/'TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk'
          mobile=root/'mobile'
          with zipfile.ZipFile(src,'r') as zin:
              infos={i.filename:i for i in zin.infolist()}
              files={i.filename:zin.read(i.filename) for i in zin.infolist()}
          keep={}
          for name,blob in files.items():
              up=name.upper()
              if name.startswith('assets/www/'): continue
              if up.startswith('META-INF/') and (up.endswith('.RSA') or up.endswith('.SF') or up.endswith('MANIFEST.MF')): continue
              keep[name]=blob
          data=bytearray(keep['AndroidManifest.xml'])
          old='1.16.69'.encode('utf-16le'); new='1.16.97'.encode('utf-16le')
          assert data.count(old)==1
          data=data.replace(old,new,1)
          code110=bytes([0x08,0x00,0x00,0x10])+(110).to_bytes(4,'little')
          pos=data.find(code110)
          assert pos>=0 and data.find(code110,pos+1)<0
          data[pos+4:pos+8]=(114).to_bytes(4,'little')
          keep['AndroidManifest.xml']=bytes(data)
          updates={}
          for p in mobile.rglob('*'):
              if p.is_file(): updates['assets/www/'+p.relative_to(mobile).as_posix()]=p.read_bytes()
          updates['assets/www/README_ANDROID_REV384.txt']=(
              'TF Analyzer Analyst Android REV384\nVersion: v1.16.97\nVersion Code: 114\n'
              'Holding Period alignment fix: 48/26/26 columns, centered tabular Max/Avg.\n'
          ).encode()
          with zipfile.ZipFile(out,'w') as zout:
              for name,blob in keep.items():
                  info=infos[name]
                  ni=zipfile.ZipInfo(name,info.date_time)
                  ni.compress_type=info.compress_type; ni.external_attr=info.external_attr; ni.internal_attr=info.internal_attr
                  ni.create_system=info.create_system; ni.extra=info.extra; ni.comment=info.comment; ni.flag_bits=info.flag_bits
                  zout.writestr(ni,blob)
              for name,blob in sorted(updates.items()):
                  ni=zipfile.ZipInfo(name,(2026,9,30,14,15,0)); ni.compress_type=zipfile.ZIP_DEFLATED; ni.create_system=3; ni.external_attr=0o100644 << 16
                  zout.writestr(ni,blob)
          print(out)
          PY
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$ROOT/rev384-fresh.jks" -storepass "$PW" -keypass "$PW" -alias tfanalyzer-rev384-fresh -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=TF Analyzer Analyst REV384 Fresh Install, OU=Mobile, O=Skill Fusion, C=ID'
          jarsigner -keystore "$ROOT/rev384-fresh.jks" -storepass "$PW" -keypass "$PW" -sigalg SHA256withRSA -digestalg SHA-256 "$ROOT/TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk" tfanalyzer-rev384-fresh
          jarsigner -verify "$ROOT/TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk" >/dev/null
          unzip -tq "$ROOT/TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk"
          python3 - <<'PY'
          import zipfile
          apk='/tmp/tf-rev384-android/TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk'
          with zipfile.ZipFile(apk) as z:
              css=z.read('assets/www/mobile-overrides.css').decode()
              upd=z.read('assets/www/mobile-force-update.js').decode()
              idx=z.read('assets/www/index.html').decode()
              dash=z.read('assets/www/assets/dashboard-mobile.js').decode()
          assert 'tf-holding-period-section' in dash and 'Nama Analis - Pair' in dash
          assert 'td:nth-child(2)' in css and 'td:nth-child(3)' in css
          assert 'font-variant-numeric:tabular-nums' in css and 'text-align:center!important' in css
          assert "var CURRENT_TAG = 'v1.16.97';" in upd
          assert '?rev=384' in idx
          print('REV384 APK embedded QA PASS')
          PY
          sha256sum "$ROOT/TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk" > "$ROOT/TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk.sha256"
      - name: Publish signing-ready assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev384-android
          TAG=v1.16.97-assets
          ZIP="$ROOT/TF_Analyzer_Android_REV384_V1.16.97_PRODUCTION_SIGNING_READY.zip"
          SHA="$ZIP.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV384 - Production Signing Ready' --notes-file release-staging/REV384-signing-ready/RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV384 - Production Signing Ready' --notes-file release-staging/REV384-signing-ready/RELEASE_NOTES.md --prerelease
          fi
      - name: Publish fresh-install APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev384-android
          TAG=v1.16.97-android
          APK="$ROOT/TF.Analyzer.Analyst.V1.16.97_REV384_HOLDING_ALIGNMENT_FIX_FRESH_INSTALL.apk"
          SHA="$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.16.97 - REV384 Fresh Install' --notes-file release-staging/REV384-apk/RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.16.97 - REV384 Fresh Install' --notes-file release-staging/REV384-apk/RELEASE_NOTES.md --prerelease
          fi
