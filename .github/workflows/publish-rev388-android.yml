name: Publish Android REV388 Performance Holding
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV388-apk/READY'
permissions:
  contents: write
concurrency:
  group: publish-android-rev388
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch REV387 mobile source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev388-android
          rm -rf "$ROOT" && mkdir -p "$ROOT/mobile" "$ROOT/base" "$ROOT/signing-ready/assets/www"
          gh release download v1.17.00 --repo wiliejonathan/tf-analyzer-analyst-ios --pattern 'TF_Analyzer_Analyst_iOS_BROWSER_REV387_HOLDING_TIMEFRAME_PARITY.zip' --output "$ROOT/mobile.zip"
          unzip -tq "$ROOT/mobile.zip"
          unzip -q "$ROOT/mobile.zip" -d "$ROOT/mobile"
      - name: Patch Android-only Performance Holding layout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/tf-rev388-android/mobile')
          shell=root/'mobile-app-shell.js'
          s=shell.read_text()
          old="    // Preserve the exact REV224 performance DOM and all bound IDs.\n    section.appendChild(perf);\n\n    const host = q('tf-dashboard-main') || document.querySelector('.page') || document.body;"
          new="    // Preserve the exact REV224 performance DOM and all bound IDs.\n    section.appendChild(perf);\n\n    // REV388 Android: move the single existing Holding Analytics DOM below Performance/Probability.\n    // Moving (not cloning) preserves every bound ID, renderer, timeframe filter, and stored state.\n    const holding = q('tf-holding-period-section');\n    if(holding){\n      holding.classList.add('tf-mobile-performance-holding-rev388');\n      section.appendChild(holding);\n    }\n\n    const host = q('tf-dashboard-main') || document.querySelector('.page') || document.body;"
          assert old in s, 'createPerformanceScreen anchor not found'
          shell.write_text(s.replace(old,new,1))
          dash=root/'assets/dashboard-mobile.js'
          d=dash.read_text()
          old_note='<div class="tf-holding-note"><strong>Max</strong> = holding period terlama dari seluruh trade yang masih termasuk ticker/analis-pair aktif. <strong>Avg.</strong> = rata-rata holding period dalam filter aktif (Time Range / Time Range per Month / Filter Tanggal).</div>'
          new_note='<div class="tf-holding-note"><strong>Max</strong> = holding period terlama dalam filter aktif. <strong>Avg.</strong> = rata-rata holding period dalam filter aktif (Time Range / Time Range per Month / Filter Tanggal / Nama Analis / Pair).</div>'
          assert old_note in d, 'Holding note anchor not found'
          d=d.replace(old_note,new_note,1)
          assert 'REV387: Max and Avg both use the exact active Table 3 filtered trade rows.' in d
          dash.write_text(d)
          css=root/'mobile-overrides.css'
          cs=css.read_text()
          css_lines=[
              '',
              '/* REV388 ANDROID ONLY — Holding Analytics under Performance/Probability */',
              '#tf-mobile-performance-screen #tf-holding-period-section{width:100%!important;max-width:100%!important;min-width:0!important;margin:14px 0 4px!important;box-sizing:border-box!important;overflow:visible!important;}',
              '#tf-mobile-performance-screen #tf-holding-period-section .tf-holding-grid{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;width:100%!important;}',
              '#tf-mobile-performance-screen #tf-holding-period-section .tf-holding-card{width:100%!important;max-width:100%!important;min-width:0!important;overflow:visible!important;}',
              '#tf-mobile-performance-screen #tf-holding-period-section .tf-holding-table{width:100%!important;min-width:0!important;table-layout:fixed!important;}',
              '#tf-mobile-performance-screen #tf-holding-period-section .tf-holding-head{align-items:flex-start!important;flex-direction:column!important;gap:7px!important;}',
              '#tf-mobile-performance-screen #tf-holding-period-section .tf-holding-formula{width:100%!important;box-sizing:border-box!important;}',
              ''
          ]
          css.write_text(cs+'\n'.join(css_lines))
          for name in ['index.html','service-worker.js','mobile-license-gate.js']:
              q=root/name
              x=q.read_text().replace('rev=387','rev=388').replace('rev387','rev388').replace('REV387','REV388')
              if name=='service-worker.js':
                  lines=x.splitlines()
                  if lines and lines[0].startswith('const CACHE='):
                      lines[0]="const CACHE='tf-analyzer-analyst-android-v158-rev388-performance-holding';"
                      x='\n'.join(lines)+'\n'
              q.write_text(x)
          upd=root/'mobile-force-update.js'
          u=upd.read_text()
          assert "var CURRENT_TAG = 'v1.17.00';" in u
          upd.write_text(u.replace("var CURRENT_TAG = 'v1.17.00';","var CURRENT_TAG = 'v1.17.01';",1))
          (root/'README_ANDROID_REV388_SOURCE.txt').write_text('TF Analyzer Analyst Android REV388 / v1.17.01\nHolding Analytics is moved into nav Performance below Performance/Probability Analis.\nHolding = Closed At - Created At; Max and Avg follow active timeframe/date/analyst/pair filters.\n')
          PY
          node --check "$ROOT/mobile/mobile-app-shell.js"
          node --check "$ROOT/mobile/assets/dashboard-mobile.js"
          node --check "$ROOT/mobile/mobile-force-update.js"
          node --check "$ROOT/mobile/service-worker.js"
      - name: Validate REV388 Android source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/tf-rev388-android/mobile')
          shell=(root/'mobile-app-shell.js').read_text()
          dash=(root/'assets/dashboard-mobile.js').read_text()
          css=(root/'mobile-overrides.css').read_text()
          idx=(root/'index.html').read_text()
          upd=(root/'mobile-force-update.js').read_text()
          assert "const holding = q('tf-holding-period-section');" in shell
          assert "section.appendChild(holding);" in shell
          assert shell.index('section.appendChild(perf);') < shell.index("section.appendChild(holding);")
          assert 'tf-mobile-performance-holding-rev388' in shell
          assert 'REV387: Max and Avg both use the exact active Table 3 filtered trade rows.' in dash
          assert '<strong>Max</strong> = holding period terlama dalam filter aktif.' in dash
          assert '#tf-mobile-performance-screen #tf-holding-period-section' in css
          assert 'grid-template-columns:1fr!important' in css
          assert '?rev=388' in idx
          assert "var CURRENT_TAG = 'v1.17.01';" in upd
          print('REV388 Android source QA PASS')
          PY
      - name: Build production-signing-ready package
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev388-android
          cp -a "$ROOT/mobile/." "$ROOT/signing-ready/assets/www/"
          printf '%s\n' 'TF Analyzer Analyst Android REV388 / v1.17.01 - Production Signing Ready' 'Holding Analytics is under nav Performance, below Performance/Probability Analis.' 'Sign with the original production/update key for update-in-place.' > "$ROOT/signing-ready/README_ANDROID_REV388_SIGNING_READY.txt"
          (cd "$ROOT/signing-ready" && zip -qr "$ROOT/TF_Analyzer_Android_REV388_V1.17.01_PRODUCTION_SIGNING_READY.zip" .)
          sha256sum "$ROOT/TF_Analyzer_Android_REV388_V1.17.01_PRODUCTION_SIGNING_READY.zip" > "$ROOT/TF_Analyzer_Android_REV388_V1.17.01_PRODUCTION_SIGNING_READY.zip.sha256"
      - name: Build fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev388-android
          gh release download v1.16.69 --repo "$GITHUB_REPOSITORY" --pattern 'TF.Analyzer.Analyst.V1.16.69_REV372.apk' --dir "$ROOT/base"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/tf-rev388-android')
          src=root/'base'/'TF.Analyzer.Analyst.V1.16.69_REV372.apk'
          out=root/'TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk'
          mobile=root/'mobile'
          with zipfile.ZipFile(src,'r') as zin:
              infos={i.filename:i for i in zin.infolist()}
              files={i.filename:zin.read(i.filename) for i in zin.infolist()}
          keep={}
          for name,blob in files.items():
              up=name.upper()
              if name.startswith('assets/www/'): continue
              if up.startswith('META-INF/') and (up.endswith('.RSA') or up.endswith('.SF') or up.endswith('MANIFEST.MF')): continue
              keep[name]=blob
          data=bytearray(keep['AndroidManifest.xml'])
          old='1.16.69'.encode('utf-16le')
          new='1.17.01'.encode('utf-16le')
          assert data.count(old)==1
          data=data.replace(old,new,1)
          code110=bytes([0x08,0x00,0x00,0x10])+(110).to_bytes(4,'little')
          pos=data.find(code110)
          assert pos>=0 and data.find(code110,pos+1)<0
          data[pos+4:pos+8]=(118).to_bytes(4,'little')
          keep['AndroidManifest.xml']=bytes(data)
          updates={}
          for q in mobile.rglob('*'):
              if q.is_file():
                  updates['assets/www/'+q.relative_to(mobile).as_posix()]=q.read_bytes()
          updates['assets/www/README_ANDROID_REV388.txt']=b'TF Analyzer Analyst Android REV388\nVersion: v1.17.01\nVersion Code: 118\nHolding Analytics moved to Performance screen below Performance/Probability Analis.\n'
          with zipfile.ZipFile(out,'w') as zout:
              for name,blob in keep.items():
                  info=infos[name]
                  ni=zipfile.ZipInfo(name,info.date_time)
                  ni.compress_type=info.compress_type
                  ni.external_attr=info.external_attr
                  ni.internal_attr=info.internal_attr
                  ni.create_system=info.create_system
                  ni.extra=info.extra
                  ni.comment=info.comment
                  ni.flag_bits=info.flag_bits
                  zout.writestr(ni,blob)
              for name,blob in sorted(updates.items()):
                  ni=zipfile.ZipInfo(name,(2026,9,30,17,10,0))
                  ni.compress_type=zipfile.ZIP_DEFLATED
                  ni.create_system=3
                  ni.external_attr=0o100644 << 16
                  zout.writestr(ni,blob)
          print(out)
          PY
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$ROOT/rev388-fresh.jks" -storepass "$PW" -keypass "$PW" -alias tfanalyzer-rev388-fresh -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=TF Analyzer Analyst REV388 Fresh Install, OU=Mobile, O=Skill Fusion, C=ID'
          jarsigner -keystore "$ROOT/rev388-fresh.jks" -storepass "$PW" -keypass "$PW" -sigalg SHA256withRSA -digestalg SHA-256 "$ROOT/TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk" tfanalyzer-rev388-fresh
          jarsigner -verify "$ROOT/TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk" >/dev/null
          unzip -tq "$ROOT/TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk"
          python3 - <<'PY'
          import zipfile
          apk='/tmp/tf-rev388-android/TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk'
          with zipfile.ZipFile(apk) as z:
              shell=z.read('assets/www/mobile-app-shell.js').decode()
              dash=z.read('assets/www/assets/dashboard-mobile.js').decode()
              css=z.read('assets/www/mobile-overrides.css').decode()
              upd=z.read('assets/www/mobile-force-update.js').decode()
              idx=z.read('assets/www/index.html').decode()
          assert "const holding = q('tf-holding-period-section');" in shell
          assert 'section.appendChild(holding);' in shell
          assert 'REV387: Max and Avg both use the exact active Table 3 filtered trade rows.' in dash
          assert '#tf-mobile-performance-screen #tf-holding-period-section' in css
          assert "var CURRENT_TAG = 'v1.17.01';" in upd
          assert '?rev=388' in idx
          print('REV388 embedded APK QA PASS')
          PY
          sha256sum "$ROOT/TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk" > "$ROOT/TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk.sha256"
      - name: Publish signing-ready assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev388-android
          TAG=v1.17.01-assets
          ZIP="$ROOT/TF_Analyzer_Android_REV388_V1.17.01_PRODUCTION_SIGNING_READY.zip"
          SHA="$ZIP.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV388 - Production Signing Ready' --notes-file release-staging/REV388-signing-ready/RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android REV388 - Production Signing Ready' --notes-file release-staging/REV388-signing-ready/RELEASE_NOTES.md --prerelease
          fi
      - name: Publish fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev388-android
          TAG=v1.17.01-android
          APK="$ROOT/TF.Analyzer.Analyst.V1.17.01_REV388_PERFORMANCE_HOLDING_FRESH_INSTALL.apk"
          SHA="$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.17.01 - REV388 Performance Holding' --notes-file release-staging/REV388-apk/RELEASE_NOTES.md --prerelease
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" --target "$GITHUB_SHA" --title 'TF Analyzer Analyst Android V1.17.01 - REV388 Performance Holding' --notes-file release-staging/REV388-apk/RELEASE_NOTES.md --prerelease
          fi
