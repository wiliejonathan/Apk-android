name: Build REV349 Strict License Fresh Start

on:
  push:
    branches:
      - rev349-live-license-fresh-start
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore current Web runtime and apply REV349 strict license policy
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/wiliejonathan/tf-analyzer-analyst-ios.git /tmp/web
          mkdir -p rev346-build/app/src/main/assets/www
          mkdir -p rev346-build/app/src/main/res/drawable
          rsync -a --exclude=.git /tmp/web/ rev346-build/app/src/main/assets/www/

          cp rev346-build/payload/MainActivityREV348.java.txt \
            rev346-build/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          cp rev346-build/payload/mobile-license-gate-rev349.js \
            rev346-build/app/src/main/assets/www/mobile-license-gate.js

          sed -i "s/versionCode 103/versionCode 106/" rev346-build/app/build.gradle
          sed -i "s/versionName '1.16.62'/versionName '1.16.65'/" rev346-build/app/build.gradle

          cp rev346-build/payload/mobile-force-update.js rev346-build/app/src/main/assets/www/mobile-force-update.js
          sed -i "s/var CURRENT_TAG = 'v1.16.62';/var CURRENT_TAG = 'v1.16.65';/" rev346-build/app/src/main/assets/www/mobile-force-update.js

          python3 rev346-build/payload/patch_rev349_runtime.py

          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('rev346-build/app/src/main/assets/www/index.html')
          s = p.read_text(encoding='utf-8')
          if 'mobile-force-update.js' not in s:
              marker = '<script src="mobile-license-gate.js'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit('mobile-license-gate marker not found')
              s = s[:pos] + '<script src="mobile-force-update.js?rev=349"></script>\n' + s[pos:]
          s = re.sub(r'\?rev=(?:344|345|346|347|348)', '?rev=349', s)
          p.write_text(s, encoding='utf-8')

          sw = Path('rev346-build/app/src/main/assets/www/service-worker.js')
          if sw.exists():
              t = sw.read_text(encoding='utf-8')
              if 'mobile-force-update.js?rev=349' not in t:
                  t = t.replace("  './mobile-license-gate.js?rev=349',",
                                "  './mobile-force-update.js?rev=349',\n  './mobile-license-gate.js?rev=349',")
              sw.write_text(t, encoding='utf-8')
          PY

          cp rev346-build/app/src/main/assets/www/icons/icon-192.png rev346-build/app/src/main/res/drawable/tf_icon.png

          node --check rev346-build/app/src/main/assets/www/mobile-force-update.js
          node --check rev346-build/app/src/main/assets/www/mobile-license-gate.js
          node --check rev346-build/app/src/main/assets/www/mobile-remote.js
          node --check rev346-build/app/src/main/assets/www/assets/dashboard-mobile.js
          grep -q 'return "v1.16.65"' rev346-build/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          grep -q 'WebStorage.getInstance().deleteAllData' rev346-build/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          grep -q 'LOAD_NO_CACHE' rev346-build/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          grep -q '__TF_MOBILE_AUTH_V349' rev346-build/app/src/main/assets/www/mobile-remote.js
          grep -q "'/license-check'" rev346-build/app/src/main/assets/www/mobile-license-gate.js
          grep -q 'startUpdatePolling' rev346-build/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java
          grep -q 'ACTION_INSTALL_PACKAGE' rev346-build/app/src/main/java/com/skillfusion/tfmultianalystmobil3/MainActivity.java

      - name: Build release APK
        working-directory: rev346-build
        run: gradle :app:assembleRelease --no-daemon

      - name: Zipalign unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          mkdir -p rev346-build/dist
          "$BUILD_TOOLS/zipalign" -f 4 \
            rev346-build/app/build/outputs/apk/release/app-release-unsigned.apk \
            rev346-build/dist/TF.Analyzer.Analyst.V1.16.56_14-unsigned-aligned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: rev349-unsigned-apk
          path: rev346-build/dist/TF.Analyzer.Analyst.V1.16.56_14-unsigned-aligned.apk
          if-no-files-found: error
