name: Finalize Android REV381 APK-only release
on:
  push:
    branches: [main]
    paths:
      - 'ci-triggers/finalize-rev381-android.txt'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize APK-only release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="v1.16.94-android"
          gh release view "$TAG" --repo "$REPO" >/dev/null
          COUNT=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets | length')
          test "$COUNT" = "1"
          NAME=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[0].name')
          case "$NAME" in
            *.apk) ;;
            *) echo "Final release asset is not APK: $NAME"; exit 1 ;;
          esac
          gh release edit "$TAG" --repo "$REPO" --latest --prerelease=false             --title "TF Analyzer Analyst Android V1.16.94 - REV381"
          if gh release view v1.16.94-rev381-qa --repo "$REPO" >/dev/null 2>&1; then
            gh release delete v1.16.94-rev381-qa --repo "$REPO" --yes --cleanup-tag
          fi
          echo "Final Android release:"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '{tag_name,name,prerelease,draft,assets:[.assets[]|{name,size,digest,browser_download_url}]}'
