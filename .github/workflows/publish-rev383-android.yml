name: Publish Android REV383 assets and fresh-install APK
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV383-apk/READY'
permissions:
  contents: write
concurrency:
  group: publish-android-rev383
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch REV383 mobile source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev383-android
          rm -rf "$ROOT"
          mkdir -p "$ROOT/mobile" "$ROOT/base" "$ROOT/signing-ready/assets/www"
          gh release download v1.16.96 --repo wiliejonathan/tf-analyzer-analyst-ios --pattern 'TF_Analyzer_Analyst_iOS_BROWSER_REV383_HOLDING_UI_FIX.zip' --output "$ROOT/mobile.zip"
          unzip -tq "$ROOT/mobile.zip"
          unzip -q "$ROOT/mobile.zip" -d "$ROOT/mobile"
          test -f "$ROOT/mobile/assets/dashboard-mobile.js"
          test -f "$ROOT/mobile/mobile-overrides.css"
          grep -F 'tf-holding-period-section' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'Nama Analis - Pair' "$ROOT/mobile/assets/dashboard-mobile.js"
          grep -F 'overflow:visible!important' "$ROOT/mobile/mobile-overrides.css"
          grep -F "var CURRENT_TAG = 'v1.16.96';" "$ROOT/mobile/mobile-force-update.js"
      - name: Build production-signing-ready package
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev383-android
          cp -a "$ROOT/mobile/." "$ROOT/signing-ready/assets/www/"
          cat > "$ROOT/signing-ready/README_ANDROID_REV383_SIGNING_READY.txt" <<'EOF'
          TF Analyzer Analyst Android REV383 / v1.16.96 - Production Signing Ready
          =========================================================================
          Web source: iOS/browser REV383 v1.16.96.
          Replace the Android production wrapper assets/www with this folder.
          Build/sign using the ORIGINAL REV330+ production/update keystore.
          A different signing key cannot update an already installed production APK.
          EOF
          (cd "$ROOT/signing-ready" && zip -qr "$ROOT/TF_Analyzer_Android_REV383_V1.16.96_PRODUCTION_SIGNING_READY.zip" .)
          sha256sum "$ROOT/TF_Analyzer_Android_REV383_V1.16.96_PRODUCTION_SIGNING_READY.zip" > "$ROOT/TF_Analyzer_Android_REV383_V1.16.96_PRODUCTION_SIGNING_READY.zip.sha256"
      - name: Build REV383 fresh-install APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev383-android
          gh release download v1.16.69 --repo "$GITHUB_REPOSITORY" --pattern 'TF.Analyzer.Analyst.V1.16.69_REV372.apk' --dir "$ROOT/base"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('/tmp/tf-rev383-android')
          src=root/'base'/'TF.Analyzer.Analyst.V1.16.69_REV372.apk'
          out=root/'TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk'
          mobile=root/'mobile'
          with zipfile.ZipFile(src,'r') as zin:
              infos={i.filename:i for i in zin.infolist()}
              files={i.filename:zin.read(i.filename) for i in zin.infolist()}
          keep={}
          for name,blob in files.items():
              up=name.upper()
              if name.startswith('assets/www/'):
                  continue
              if up.startswith('META-INF/') and (up.endswith('.RSA') or up.endswith('.SF') or up.endswith('MANIFEST.MF')):
                  continue
              keep[name]=blob
          data=bytearray(keep['AndroidManifest.xml'])
          old='1.16.69'.encode('utf-16le')
          new='1.16.96'.encode('utf-16le')
          assert data.count(old)==1
          data=data.replace(old,new,1)
          code110=bytes([0x08,0x00,0x00,0x10])+(110).to_bytes(4,'little')
          pos=data.find(code110)
          assert pos>=0 and data.find(code110,pos+1)<0
          data[pos+4:pos+8]=(113).to_bytes(4,'little')
          keep['AndroidManifest.xml']=bytes(data)
          updates={}
          for p in mobile.rglob('*'):
              if p.is_file():
                  updates['assets/www/'+p.relative_to(mobile).as_posix()]=p.read_bytes()
          updates['assets/www/README_ANDROID_REV383.txt']=(
              'TF Analyzer Analyst Android REV383\\n'
              'Version: v1.16.96\\n'
              'Version Code: 113\\n'
              'Mobile source: iOS/browser REV383 v1.16.96\\n'
              'Fresh-install QA signature: production update key not present in repository.\\n'
          ).encode()
          with zipfile.ZipFile(out,'w') as zout:
              for name,blob in keep.items():
                  info=infos[name]
                  ni=zipfile.ZipInfo(name,info.date_time)
                  ni.compress_type=info.compress_type
                  ni.external_attr=info.external_attr
                  ni.internal_attr=info.internal_attr
                  ni.create_system=info.create_system
                  ni.extra=info.extra
                  ni.comment=info.comment
                  ni.flag_bits=info.flag_bits
                  zout.writestr(ni,blob)
              for name,blob in sorted(updates.items()):
                  ni=zipfile.ZipInfo(name,(2026,9,30,13,0,0))
                  ni.compress_type=zipfile.ZIP_DEFLATED
                  ni.create_system=3
                  ni.external_attr=0o100644 << 16
                  zout.writestr(ni,blob)
          print(out)
          PY
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$ROOT/rev383-fresh.jks" -storepass "$PW" -keypass "$PW" -alias tfanalyzer-rev383-fresh -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=TF Analyzer Analyst REV383 Fresh Install, OU=Mobile, O=Skill Fusion, C=ID'
          jarsigner -keystore "$ROOT/rev383-fresh.jks" -storepass "$PW" -keypass "$PW" -sigalg SHA256withRSA -digestalg SHA-256 "$ROOT/TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk" tfanalyzer-rev383-fresh
          jarsigner -verify "$ROOT/TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk" >/dev/null
          unzip -tq "$ROOT/TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk"
          python3 - <<'PY'
          import zipfile
          apk='/tmp/tf-rev383-android/TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk'
          with zipfile.ZipFile(apk) as z:
              dash=z.read('assets/www/assets/dashboard-mobile.js').decode()
              css=z.read('assets/www/mobile-overrides.css').decode()
              upd=z.read('assets/www/mobile-force-update.js').decode()
              idx=z.read('assets/www/index.html').decode()
          assert 'tf-holding-period-section' in dash
          assert 'Nama Analis - Pair' in dash
          assert 'tf_renderHoldingPeriodTables' in dash
          assert 'overflow:visible!important' in css
          assert 'text-align:center!important' in css
          assert "var CURRENT_TAG = 'v1.16.96';" in upd
          assert '?rev=383' in idx
          print('REV383 APK embedded QA PASS')
          PY
          sha256sum "$ROOT/TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk" > "$ROOT/TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk.sha256"
      - name: Publish production-signing-ready assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev383-android
          TAG=v1.16.96-assets
          TITLE='TF Analyzer Analyst Android REV383 - Production Signing Ready'
          NOTES=release-staging/REV383-signing-ready/RELEASE_NOTES.md
          ZIP="$ROOT/TF_Analyzer_Android_REV383_V1.16.96_PRODUCTION_SIGNING_READY.zip"
          SHA="$ZIP.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --prerelease
            gh release upload "$TAG" "$ZIP" "$SHA" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --prerelease
          fi
      - name: Publish fresh-install APK prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT=/tmp/tf-rev383-android
          TAG=v1.16.96-android
          TITLE='TF Analyzer Analyst Android V1.16.96 - REV383 Fresh Install'
          NOTES=release-staging/REV383-apk/RELEASE_NOTES.md
          APK="$ROOT/TF.Analyzer.Analyst.V1.16.96_REV383_HOLDING_UI_FIX_FRESH_INSTALL.apk"
          SHA="$APK.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --prerelease
            gh release upload "$TAG" "$APK" "$SHA" --clobber
          else
            gh release create "$TAG" "$APK" "$SHA" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES" --prerelease
          fi
