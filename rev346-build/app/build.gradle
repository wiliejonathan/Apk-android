plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skillfusion.tfmultianalystmobil3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.skillfusion.tfmultianalystmobil0'
        minSdk 24
        targetSdk 29
        versionCode 103
        versionName '1.16.62'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    // This APK is distributed directly from GitHub Releases, not Google Play.
    // Preserve targetSdk 29 to stay behavior-compatible with the existing app,
    // while preventing the modern Android Gradle Plugin's Play-target lint rule
    // from aborting a sideload release build.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
